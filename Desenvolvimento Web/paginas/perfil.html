<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Senna Bank - Perfil</title>
        <link rel="stylesheet" href="../estilos/perfil.css">
        <link rel="shortcut icon" href="../midias/LogoSo2SemFundo.png" type="image/x-icon">
    </head>
    <body>
        <header class="perfil-header">
            <img src="../midias/LogoSo2SemFundo.png" alt="Imagem do site">
            <h1>Bem-Vindo ao seu perfil no Senna Bank!</h1>
            <div class="perfil-perfil">
                <img src="../midias/perfil.jpg" alt="Imagem de Perfil">
            </div>
        </header>
        <main class="perfil-main">
            <aside class="perfil-aside">
                <h3>SENNA BANK</h3>
                <hr>
                <nav class="perfil-navegacao">
                    <div class="nav-item">
                        <span class="nav-icon">📊</span>
                        <span>Conta</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">💳</span>
                        <span>Cartões</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">📄</span>
                        <span>Extrato</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">🔄</span>
                        <span>Transações</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">📈</span>
                        <span>Investimentos</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">💰</span>
                        <span>Empréstimos</span>
                    </div>
                    <div class="nav-item">
                        <span class="nav-icon">🔔</span>
                        <span>Notificações</span>
                    </div>
                </nav>
            </aside>
            <section class="perfil-conteudo">
                <h1>TESTE</h1>
            </section>
        </main>
        <footer>
            <section class="nomeado">
                <h4><strong>SENNA</strong> BANK</h4>
            </section>
            <section class="direitos">
                <p>© 2026 Senna Bank — Todos os direitos reservados</p>
                <p>CNPJ: 00.000.000/0001-00 • Banco autorizado pelo Banco Central</p>
            </section>
        </footer>
    </body>
</html>
